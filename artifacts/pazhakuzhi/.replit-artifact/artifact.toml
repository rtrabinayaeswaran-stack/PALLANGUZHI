kind = "web"
previewPath = "/"
title = "Pazhakuzhi Tamil Village Game"
description = "A responsive Tamil and English virtual Pallankuzhi game with deterministic rules, Player vs Computer and local two-player modes, a traditional village-inspired board, tutorials, statistics, sound controls, and local game persistence."
version = "1.0.0"
id = "artifacts/pazhakuzhi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20314

[services.development]
run = "pnpm --filter @workspace/pazhakuzhi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pazhakuzhi", "run", "build" ]
serve = "static"
publicDir = "artifacts/pazhakuzhi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20314"
BASE_PATH = "/"
